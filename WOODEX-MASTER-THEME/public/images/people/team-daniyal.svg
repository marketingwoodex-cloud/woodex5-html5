<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <pattern id="dots" width="39.6" height="39.6" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.3" fill="#0f1e36" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="1600" fill="#ffffff"/>
  <rect width="1200" height="1600" fill="url(#dots)"/>

  <!-- ceiling datum + floor plane, so the drawing has body at card size -->
  <path d="M0 160h1200" stroke="#0f1e36" stroke-opacity="0.12" stroke-width="1.6666666666666667"/>
  <rect y="1344" width="1200" height="256" fill="#0f1e36" fill-opacity="0.045"/>
  <path d="M0 1344h1200" stroke="#0f1e36" stroke-opacity="0.32" stroke-width="1.6666666666666667"/>

  <!-- arched opening -->
  <path d="M84.00000000000001 1344V672a94.8 94.8 0 0 1 189.6 0V1344Z"
        fill="#0f1e36" fill-opacity="0.07" stroke="#0f1e36" stroke-opacity="0.45" stroke-width="1.6666666666666667"/>
  <path d="M178.8 672V1344"
        stroke="#0f1e36" stroke-opacity="0.16" stroke-width="1.6666666666666667"/>

  <!-- fluting: five thin verticals -->
  <path d="M372 480V1344" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M392.4 480V1344" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M412.8 480V1344" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M433.2 480V1344" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M453.6 480V1344" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>

  <!-- window: frame, mullion, sill -->
  <rect x="528" y="256" width="336.00000000000006" height="896.0000000000001"
        fill="#0f1e36" fill-opacity="0.045" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M696 256v896.0000000000001" stroke="#0f1e36" stroke-opacity="0.2" stroke-width="1.3333333333333335"/>
  <path d="M504 1152h384" stroke="#0f1e36" stroke-opacity="0.34" stroke-width="1.6666666666666667"/>

  <!-- plinth / bench under the window -->
  <path d="M504 1344h384v-96h-384Z"
        fill="#0f1e36" fill-opacity="0.1"/>
  <path d="M504 1248h384" stroke="#0f1e36" stroke-opacity="0.38" stroke-width="1.6666666666666667"/>

  <!-- pendant -->
  <path d="M960 160v256" stroke="#0f1e36" stroke-opacity="0.24" stroke-width="1.3333333333333335"/>
  <circle cx="960" cy="448.00000000000006" r="20.400000000000002" fill="none"
          stroke="#0f1e36" stroke-opacity="0.42" stroke-width="1.6666666666666667"/>

  <!-- corner registration marks -->
  <path d="M54 96v21.599999999999998M54 96h21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M1146 96v21.599999999999998M1146 96h-21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M54 1248v-21.599999999999998M54 1248h21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M1146 1248v-21.599999999999998M1146 1248h-21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>

  <!-- scale bar -->
  <rect x="552" y="1416" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.28"/>
  <rect x="576" y="1416" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.5"/>
  <rect x="600" y="1416" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.28"/>
  <rect x="624" y="1416" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.5"/>

  <!-- label -->
  <path d="M66 1448.9h1068" stroke="#0f1e36" stroke-opacity="0.18" stroke-width="1.6666666666666667"/>
  <path d="M66 1448.9h60" stroke="#0f1e36" stroke-opacity="0.6" stroke-width="3"/>
  <text x="66" y="1488" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="23" letter-spacing="3.8400000000000003"
        fill="#0f1e36" fill-opacity="0.62">TEAM DANIYAL</text>
  <text x="1134" y="1488" text-anchor="end" font-family="system-ui,-apple-system,sans-serif"
        font-size="18.86" letter-spacing="3.1199999999999997"
        fill="#0f1e36" fill-opacity="0.34">PHOTOGRAPH PENDING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="dots" width="39.6" height="39.6" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.3" fill="#0f1e36" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="800" fill="#fcf2e8"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <!-- ceiling datum + floor plane, so the drawing has body at card size -->
  <path d="M0 80h1200" stroke="#0f1e36" stroke-opacity="0.12" stroke-width="1.6666666666666667"/>
  <rect y="672" width="1200" height="128" fill="#0f1e36" fill-opacity="0.045"/>
  <path d="M0 672h1200" stroke="#0f1e36" stroke-opacity="0.32" stroke-width="1.6666666666666667"/>

  <!-- arched opening -->
  <path d="M84.00000000000001 672V336a104.39999999999999 104.39999999999999 0 0 1 208.79999999999998 0V672Z"
        fill="#0f1e36" fill-opacity="0.07" stroke="#0f1e36" stroke-opacity="0.45" stroke-width="1.6666666666666667"/>
  <path d="M188.4 336V672"
        stroke="#0f1e36" stroke-opacity="0.16" stroke-width="1.6666666666666667"/>

  <!-- fluting: five thin verticals -->
  <path d="M372 240V672" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M392.4 240V672" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M412.8 240V672" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M433.2 240V672" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M453.6 240V672" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>

  <!-- window: frame, mullion, sill -->
  <rect x="528" y="128" width="336.00000000000006" height="448.00000000000006"
        fill="#0f1e36" fill-opacity="0.045" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M696 128v448.00000000000006" stroke="#0f1e36" stroke-opacity="0.2" stroke-width="1.3333333333333335"/>
  <path d="M504 576h384" stroke="#0f1e36" stroke-opacity="0.34" stroke-width="1.6666666666666667"/>

  <!-- plinth / bench under the window -->
  <path d="M504 672h384v-48h-384Z"
        fill="#0f1e36" fill-opacity="0.1"/>
  <path d="M504 624h384" stroke="#0f1e36" stroke-opacity="0.38" stroke-width="1.6666666666666667"/>

  <!-- pendant -->
  <path d="M960 80v128" stroke="#0f1e36" stroke-opacity="0.24" stroke-width="1.3333333333333335"/>
  <circle cx="960" cy="224.00000000000003" r="20.400000000000002" fill="none"
          stroke="#0f1e36" stroke-opacity="0.42" stroke-width="1.6666666666666667"/>

  <!-- corner registration marks -->
  <path d="M54 48v21.599999999999998M54 48h21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M1146 48v21.599999999999998M1146 48h-21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M54 624v-21.599999999999998M54 624h21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M1146 624v-21.599999999999998M1146 624h-21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>

  <!-- scale bar -->
  <rect x="552" y="708" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.28"/>
  <rect x="576" y="708" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.5"/>
  <rect x="600" y="708" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.28"/>
  <rect x="624" y="708" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.5"/>

  <!-- label -->
  <path d="M66 704.9h1068" stroke="#0f1e36" stroke-opacity="0.18" stroke-width="1.6666666666666667"/>
  <path d="M66 704.9h60" stroke="#0f1e36" stroke-opacity="0.6" stroke-width="3"/>
  <text x="66" y="744" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="23" letter-spacing="3.8400000000000003"
        fill="#0f1e36" fill-opacity="0.62">JOINERY DETAIL COVER</text>
  <text x="1134" y="744" text-anchor="end" font-family="system-ui,-apple-system,sans-serif"
        font-size="18.86" letter-spacing="3.1199999999999997"
        fill="#0f1e36" fill-opacity="0.34">PHOTOGRAPH PENDING</text>
</svg>

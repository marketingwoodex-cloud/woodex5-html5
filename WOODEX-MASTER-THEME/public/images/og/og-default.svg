<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dots" width="39.6" height="39.6" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.3" fill="#0f1e36" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- ceiling datum + floor plane, so the drawing has body at card size -->
  <path d="M0 63h1200" stroke="#0f1e36" stroke-opacity="0.12" stroke-width="1.6666666666666667"/>
  <rect y="529.1999999999999" width="1200" height="100.80000000000007" fill="#0f1e36" fill-opacity="0.045"/>
  <path d="M0 529.1999999999999h1200" stroke="#0f1e36" stroke-opacity="0.32" stroke-width="1.6666666666666667"/>

  <!-- arched opening -->
  <path d="M84.00000000000001 529.1999999999999V264.59999999999997a109.2 109.2 0 0 1 218.4 0V529.1999999999999Z"
        fill="#0f1e36" fill-opacity="0.07" stroke="#0f1e36" stroke-opacity="0.45" stroke-width="1.6666666666666667"/>
  <path d="M193.20000000000002 264.59999999999997V529.1999999999999"
        stroke="#0f1e36" stroke-opacity="0.16" stroke-width="1.6666666666666667"/>

  <!-- fluting: five thin verticals -->
  <path d="M372 189V529.1999999999999" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M392.4 189V529.1999999999999" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M412.8 189V529.1999999999999" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M433.2 189V529.1999999999999" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>
  <path d="M453.6 189V529.1999999999999" stroke="#0f1e36" stroke-opacity="0.26" stroke-width="1.5"/>

  <!-- window: frame, mullion, sill -->
  <rect x="528" y="100.8" width="336.00000000000006" height="352.8"
        fill="#0f1e36" fill-opacity="0.045" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M696 100.8v352.8" stroke="#0f1e36" stroke-opacity="0.2" stroke-width="1.3333333333333335"/>
  <path d="M504 453.59999999999997h384" stroke="#0f1e36" stroke-opacity="0.34" stroke-width="1.6666666666666667"/>

  <!-- plinth / bench under the window -->
  <path d="M504 529.1999999999999h384v-37.8h-384Z"
        fill="#0f1e36" fill-opacity="0.1"/>
  <path d="M504 491.3999999999999h384" stroke="#0f1e36" stroke-opacity="0.38" stroke-width="1.6666666666666667"/>

  <!-- pendant -->
  <path d="M960 63v100.8" stroke="#0f1e36" stroke-opacity="0.24" stroke-width="1.3333333333333335"/>
  <circle cx="960" cy="176.4" r="20.400000000000002" fill="none"
          stroke="#0f1e36" stroke-opacity="0.42" stroke-width="1.6666666666666667"/>

  <!-- corner registration marks -->
  <path d="M54 37.8v21.599999999999998M54 37.8h21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M1146 37.8v21.599999999999998M1146 37.8h-21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M54 491.40000000000003v-21.599999999999998M54 491.40000000000003h21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>
  <path d="M1146 491.40000000000003v-21.599999999999998M1146 491.40000000000003h-21.599999999999998" fill="none" stroke="#0f1e36" stroke-opacity="0.4" stroke-width="1.6666666666666667"/>

  <!-- scale bar -->
  <rect x="552" y="557.55" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.28"/>
  <rect x="576" y="557.55" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.5"/>
  <rect x="600" y="557.55" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.28"/>
  <rect x="624" y="557.55" width="24" height="8.4" fill="#0f1e36" fill-opacity="0.5"/>

  <!-- label -->
  <path d="M66 546.8h1068" stroke="#0f1e36" stroke-opacity="0.18" stroke-width="1.6666666666666667"/>
  <path d="M66 546.8h60" stroke="#0f1e36" stroke-opacity="0.6" stroke-width="3"/>
  <text x="66" y="585.9" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="23" letter-spacing="3.8400000000000003"
        fill="#0f1e36" fill-opacity="0.62">OG DEFAULT</text>
  <text x="1134" y="585.9" text-anchor="end" font-family="system-ui,-apple-system,sans-serif"
        font-size="18.86" letter-spacing="3.1199999999999997"
        fill="#0f1e36" fill-opacity="0.34">PHOTOGRAPH PENDING</text>
</svg>
